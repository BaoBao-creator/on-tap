<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0ea5e9">
  <title>Làm bài</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="exam-body">
  <header class="exam-header">
    <a class="back-btn" href="./index.html">← Menu</a>
    <h1 id="exam-title">Đang tải...</h1>
    <div id="net-status" class="net-status">
      <span class="dot"></span>
      <span class="label"></span>
    </div>
  </header>

  <div class="exam-layout">
    <section class="pdf-pane">
      <div class="pdf-toolbar">
        <button class="ptbtn" id="zoom-out" title="Thu nhỏ">−</button>
        <span class="zoom-label" id="zoom-label">100%</span>
        <button class="ptbtn" id="zoom-in" title="Phóng to">+</button>
        <button class="ptbtn" id="zoom-reset" title="Reset zoom">↺</button>

      </div>
      <div id="pdf-container" class="pdf-container">
        <div id="pdf-zoom-wrap" class="pdf-zoom-wrap"><div id="pdf-zoom-content" class="pdf-zoom-content"></div></div>
      </div>
    </section>

    <aside class="answer-pane">
      <div class="answer-progress-wrap">
        <div class="answer-progress-meta">
          <span id="progress-text">Đã làm 0/0 câu</span>
          <span id="progress-percent">0%</span>
        </div>
        <div
          id="answer-progress"
          class="answer-progress"
          role="progressbar"
          aria-label="Tiến độ làm bài"
          aria-valuemin="0"
          aria-valuemax="0"
          aria-valuenow="0"
          aria-valuetext="Chưa có câu trả lời"
        >
          <div id="answer-progress-fill" class="answer-progress-fill"></div>
        </div>
      </div>
      <div class="answer-list" id="answer-list"></div>
      <div class="answer-footer">
        <button class="btn btn-primary" id="submit-btn" type="button">Nộp bài</button>
        <div class="review-actions" id="review-actions">
          <button class="btn btn-secondary retry-action" type="button">Làm lại</button>
          <a class="btn btn-primary" href="./index.html">Về menu</a>
        </div>
      </div>
    </aside>
  </div>

  <div class="question-picker-overlay hidden" id="question-picker" role="dialog" aria-modal="true" aria-labelledby="question-picker-title">
    <section class="question-picker-card">
      <div class="question-picker-header">
        <h2 id="question-picker-title">Chọn câu</h2>
        <button class="question-picker-close" id="close-question-picker" type="button" aria-label="Đóng">×</button>
      </div>
      <div class="question-picker-list" id="question-picker-list"></div>
      <p class="question-picker-legend"><span class="legend-dot answered"></span> Đã trả lời</p>
    </section>
  </div>

  <div class="loading-overlay" id="loading-overlay">
    <div class="spinner"></div>
    <p id="loading-text">Đang tải đề...</p>
  </div>

  <div class="result-overlay hidden" id="result-overlay">
    <div class="result-card">
      <h2>Kết quả</h2>
      <p class="result-score" id="result-score">0 / 0</p>
      <p class="result-detail" id="result-detail"></p>
      <div class="result-actions">
        <button class="btn btn-secondary" id="result-review-btn" type="button">Xem bài làm</button>
        <button class="btn btn-secondary retry-action" type="button">Làm lại</button>
        <a class="btn btn-primary" href="./index.html">Về menu</a>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW:', e));
    }
  </script>
  <script src="./pdfjs/pdf.min.js"></script>
  <script type="module" src="./js/exam.js"></script>
</body>
</html>
